in-height:0;display:inline\">Confidentialité\u003c/button>\u003c/span>\u003c/footer>\n\u003c/div>\n\n\u003cdialog id=\"dlg\" aria-labelledby=\"dlg-title\">\n  \u003cdiv class=\"dlgtop\">\u003ch2 id=\"dlg-title\">Compte\u003c/h2>\u003cbutton class=\"x\" id=\"dlg-x\" type=\"button\" aria-label=\"Fermer\">×\u003c/button>\u003c/div>\n\n  \u003cdiv class=\"stack\" id=\"dlg-config\" hidden>\n    \u003cp class=\"hint\">Colle ici la configuration web de ton projet Firebase. Elle reste dans ce navigateur.\u003c/p>\n    \u003cdiv class=\"field\">\u003clabel for=\"cfg-text\">Configuration Firebase\u003c/label>\n      \u003ctextarea class=\"in\" id=\"cfg-text\" spellcheck=\"false\" placeholder='{\"apiKey\":\"…\",\"authDomain\":\"…\",\"projectId\":\"…\",\"appId\":\"…\"}'>\u003c/textarea>\u003c/div>\n    \u003cp class=\"err\" id=\"cfg-err\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003cbutton class=\"btn main\" id=\"cfg-save\" type=\"button\">Activer les comptes\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"stack\" id=\"dlg-auth\" hidden>\n    \u003cdiv class=\"lamp\" aria-hidden=\"true\">\n      \u003csvg class=\"svg\" viewBox=\"0 0 120 84\">\u003cpath d=\"M60 0v26\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/>\u003cpath d=\"M33 59C36 36 48 27 60 27s24 9 27 32z\" fill=\"currentColor\"/>\u003ccircle class=\"bulb\" cx=\"60\" cy=\"62\" r=\"7\"/>\u003cpath d=\"M30 59h60\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003c/svg>\n      \u003ci class=\"cone\">\u003c/i>\n      \u003ci class=\"ff\" style=\"--x:30%;--y:46px;--d:5.2s;--dl:.2s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:68%;--y:58px;--d:6.4s;--dl:1.1s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:22%;--y:84px;--d:7s;--dl:2s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:78%;--y:90px;--d:5.8s;--dl:.6s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:48%;--y:100px;--d:6.8s;--dl:1.6s\">\u003c/i>\n    \u003c/div>\n    \u003ch3 class=\"auth-h\" id=\"auth-h\">Content de te revoir\u00 f(name), n = name, i = 2;\n  var has = function(x){ return out.some(function(o){ return o.name === x; }); };\n  while(has(n)){ n = base + '-' + i + (ext ? '.' + ext : ''); i++; }\n  out.push({ name: n, blob: blob });\n}\nfunction loadImage(f){\n  return new Promise(function(res, rej){\n    var u = URL.createObjectURL(f), im = new Image();\n    im.onload = function(){ URL.revokeObjectURL(u); res(im); };\n    im.onerror = function(){ URL.revokeObjectURL(u); rej(fail('« ' + f.name + ' » n’a pas pu être lu comme une image.', true)); };\n    im.src = u;\n  });\n}\nfunction capPages(n, ctx, name){\n  var cap = L().pages;\n  if(n > cap){ ctx.note('« ' + name + ' » : seules les ' + cap + ' premières pages sur ' + n + ' ont été converties. Un compte gratuit lève cette limite.'); return cap; }\n  return n;\n}\n\n/* ---------- PDF reading ---------- */\nasync function pdfOpen(file){\n  var pdfjs = await lib('pdfjs');\n  var data = new Uint8Array(await file.arrayBuffer());\n  try{ return await pdfjs.getDocument({ data: data }).promise; }\n  catch(e){\n    if(e && e.name === 'PasswordException') fail('« ' + file.name + ' » est protégé par un mot de passe.');\n    fail('« ' + file.name + ' » n’est pas un PDF valide.');\n  }\n}\n\n/* Turns the text items of one page into paragraphs: lines first (same baseline), then paragraphs (line gap, short lines). */\nfunction pageParas(items){\n  var lines = [], cur = null;\n  items.forEach(function(it){\n    if(typeof it.str !== 'string' || !it.transform) return;\n    var y = it.transform[5], x = it.transform[4];\n    var h = Math.abs(it.height) || Math.abs(it.transform[3]) || 10;\n    if(!cur || Math.abs(y - cur.y) > h * 0.5){\n      if(cur) lines.push(cur);\n      cur = { y: y, h: h, s: '', x0: x, end: null };\n    }\n    if(cur.end !== null && x - cur.end > h * 0.15 && cur.s && !/\\s$/.test(cur.s) && !/^\\s/.test(it.str)) cur.s += ' ';\n    cur.s += it.str;\n    cur.end = x + (it.width || 0);\n    if(h > cur.h) cur.h = h;\n  });\n  if(cur) lines.push(cur);\n  lines = lines.filter(function(l){ return l.s.trim() !== ''; });\n  if(!lines.length) return [];\n  var left = Math.min.apply(null, lines.map(function(l){ return l.x0; }));\n  var right = Math.max.apply(null, lines.map(function(l){ return l.end; }));\n  var shortEnd = left + (right - left) * 0.65;\n  var paras = [], p = null, prev = null;\n  lines.forEach(function(l){\n    var t = l.s.replace(/\\s+$/, '');\n    var brk = !p || !prev || Math.abs(prev.y - l.y) > Math.max(prev.h, l.h) * 1.7 || prev.end \u003c shortEnd;\n    if(brk){ if(p) paras.push(p); p = { t: t, h: l.h }; }\n    else if(/\\S-$/.test(p.t)){ p.t += t; }\n    else { p.t += ' ' + t; }\n    prev = l;\n  });\n  if(p) paras.push(p);\n  return paras;\n}\nfunction median(a){\n  if(!a.length) return 0;\n  var s = a.slice().sort(function(x, y){ return x - y; });\n  return s[Math.floor(s.length / 2)];\n}\n\n/* ---------- Minimal .docx writer (text, headings, page breaks) ---------- */\nfunction xesc(s){\n  return String(s).replace(/[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\ufffe\\uffff]/g, '')\n    .replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;');\n}\nasync function docxBlob(paras){\n  var JSZip = await lib('jszip'), z = new JSZip();\n  var body = paras.map(function(p){\n    if(p.pb) return '\u003cw:p>\u003cw:r>\u003cw:br w:type=\"page\"/>\u003c/w:r>\u003c/w:p>';\n    var ppr = p.head ? '\u003cw:pPr>\u003cw:keepNext/>\u003cw:spacing w:before=\"240\" w:after=\"120\"/>\u003c/w:pPr>' : '';\n    var rpr = p.head ? '\u003cw:rPr>\u003cw:b/>\u003cw:sz w:val=\"30\"/>\u003c/w:rPr>' : '';\n    return '\u003cw:p>' + ppr + '\u003cw:r>' + rpr + '\u003cw:t xml:space=\"preserve\">' + xesc(p.t) + '\u003c/w:t>\u003c/w:r>\u003c/w:p>';\n  }).join('');\n  var NS = 'xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"';\n  var H = '\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>';\n  z.file('[Content_Types].xml', H + '\u003cTypes xmlns=\"http:/ ordprocessingml.document', compression: 'DEFLATE' });\n}\n\n/* ---------- Text cleaning for jsPDF's built-in fonts (Latin-1 only) ---------- */\nvar MAP = { '‘':\"'\", '’':\"'\", '‚':',', '‛':\"'\", '“':'\"', '”':'\"', '„':'\"', '–':'-', '—':'-', '−':'-', '…':'...', '•':'-', '€':'EUR', 'œ':'oe', 'Œ':'OE', '™':'(TM)', '‹':'\u003c', '›':'>', '†':'+', '‡':'+' };\nfunction latin(s){\n  return String(s).replace(/[      ]/g, ' ').replace(/[​-‍\\ufeff]/g, '')\n    .replace(/[\\r\\n\\t]+/g, ' ')\n    .replace(/[^ -~ -ÿ]/g, function(c){ return MAP[c] !== undefined ? MAP[c] : '?'; });\n}\n\n/* ---------- CSV ---------- */\nfunction parseCSV(t, d){\n  var rows = [], row = [], f = '', q = false, i, c;\n  for(i = 0; i \u003c t.length; i++){\n    c = t[i];\n    if(q){\n      if(c === '\"'){ if(t[i + 1] === '\"'){ f += '\"'; i++; } else q = false; }\n      else f += c;\n    }\n    else if(c === '\"' && f === '') q = true;\n    else if(c === d){ row.push(f); f = ''; }\n    else if(c === '\\n' || c === '\\r'){\n      if(c === '\\r' && t[i + 1] === '\\n') i++;\n      row.push(f); rows.push(row); row = []; f = '';\n    }\n    else f += c;\n  }\n  if(f !== '' || row.length){ row.push(f); rows.push(row); }\n  while(rows.length && rows[rows.length - 1].every(function(x){ return x === ''; })) rows.pop();\n  return rows;\n}\nfunction sniff(t){\n  var first = t.split(/\\r?\\n/)[0] || '';\n  var best = ',', n = -1;\n  [';', ',', '\\t', '|'].forEach(function(d){\n    var k = first.split(d).length;\n    if(k > n){ n = k; best = d; }\n  });\n  return best;\n}\nfunction typed(v){\n  if(/^-?(0|[1-9]\\d*)([.,]\\d+)?$/.test(v)){ var n = parseFloat(v.replace(',', '.')); if(isFinite(n)) return n; }\n  return v;\n}\n\n/* ---------- Page ranges ---------- */\nfunction parseRanges(str, n){\n  var out = [], seen = {};\n  str.split(/[,;\\s]+/).filter(Boolean).forEach(function(part){\n    var m = /^(\\d*)-(\\d*)$/.exec(part), a, b;\n    if(m && (m[1] || m[2])){ a = m[1] ? +m[1] : 1; b = m[2] ? +m[2] : n; } ('data-s', s); }\nfunction reflow(el){ void el.offsetWidth; }\nvar DL = {\n  inner: inner,\n  make: function(label, o){\n    o = o || {};\n    var b = document.createElement('button');\n    b.type = 'button'; b.className = 'dl' + (o.block ? ' block' : '') + (o.main ? ' main' : '');\n    b.innerHTML = inner(label, o.sub);\n    b.setAttribute('data-s', 'idle');\n    return b;\n  },\n  state: function(b){ return b.getAttribute('data-s') || 'idle'; },\n  start: function(b, o){\n    if(DL.state(b) !== 'idle') return false;\n    var p = pillOf(b);\n    b._w = p.offsetWidth;\n    p.style.width = b._w + 'px'; reflow(p);\n    if(o && o.cancel === false) b.setAttribute('data-nc', '1'); else b.removeAttribute('data-nc');\n    DL.progress(b, 0);\n    state(b, 'busy');\n    p.style.width = H + 'px';\n    return true;\n  },\n  progress: function(b, v){\n    var bar = b.querySelector('.dl-ring .b');\n    if(bar) bar.style.strokeDashoffset = String(100 - Math.round(Math.max(0, Math.min(1, v)) * 100));\n  },\n  expand: function(b, then){\n    var p = pillOf(b);\n    p.style.width = (b._w || 220) + 'px';\n    clearTimeout(b._t);\n    b._t = setTimeout(function(){ p.style.width = ''; if(then) then(); }, 520);\n  },\n  finish: function(b){\n    if(DL.state(b) !== 'busy') return;\n    DL.progress(b, 1);\n    clearTimeout(b._t);\n    b._t = setTimeout(function(){\n      state(b, 'dot');\n      b._t = setTimeout(function(){\n        state(b, 'done');\n        DL.expand(b, function(){\n          b._t = setTimeout(function(){ state(b, 'idle'); DL.progress(b, 0); }, 1500);\n        });\n      }, 420);\n    }, 220);\n  },\n  abort: function(b){\n    if(DL.state(b) === 'idle') return;\n    clearTimeout(b._t);\n    state(b, 'idle');\n    DL.progress(b, 0);\n    DL.expand(b);\n  },\n  /* Anime l'anneau sur « ms » millisecondes. Résout true si l'animation va au bout, false si on a annulé. */\n  fake: function(b, ms){\n    return new Promise(function(res){\n      var t0 = performance.now();\n      (function step(now){\n        if(DL.state(b) !== 'busy'){ res(false); return; }\n        var k = Math.min(1, (now - t0) / ms);\n        DL.progress(b, k * k * (3 - 2 * k));\n        if(k \u003c 1) requestAnimationFrame(step); else res(true);\n      })(t0);\n    });\n  }\n};\nCV.DL = DL;\n\n/* ---------- Champs de connexion : œil + faisceau, nom du bouton selon l'onglet ---------- */\ndocument.addEventListener('DOMContentLoaded', function(){\n  var eye = document.getElementById('a-eye'), pass = document.getElementById('a-pass');\n  if(!eye || !pass) return;\n  eye.addEventListener('click', function(){\n    var show = pass.type === 'password';\n    pass.type = show ? 'text' : 'password';\n    eye.setAttribute('aria-pressed', show ? 'true' : 'false');\n    eye.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');\n    var box = pass.parentNode;\n    box.classList.remove('beam'); reflow(box); box.classList.add('beam');\n    setTimeout(function(){ box.classList.remove('beam'); }, 800);\n    pass.focus();\n  });\n});\n})();\n\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"top\">\n    \u003cheader class=\"hero\">\n      \u003cspan class=\"pill\">\u003ci>\u003c/i>Gratuit · Sans inscription · Sur ton appareil\u003c/span>\n      \u003ch1>Convertisseur audio 8D en ligne\u003c/h1>\n      \u003cp class=\"lede\">Fais tourner n’importe quel morceau autour de ta tête, ralentis-le, accélère-le ou renforce ses basses, puis exporte le résultat en MP3 ou en WAV. Tout se passe sur ton appareil.\u003c/p>\n      \u003cdiv class=\"trust\">\u003cspan>\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 16v-4a8 8 0 0 1 16 0v4\"/>\u003crect x=\"3\" y=\"14\" width=\"4.5\" height=\"6.5\" rx=\"1.8\"/>\u003crect x=\"16.5\" y=\"14\" width=\"4.5\" height=\"6.5\" rx=\"1.8\"/>\u003c/svg>À écouter au casque\u003c/span>\u003cspan>\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M13 2.5 4.5 14H11l-1 7.5L19.5 10H13z\"/>\u003c/svg>Aperçu en direct\u003c/span>\u003cspan>\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2.5\"/>\u003cpath d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>\u003c/svg>Aucun fichier envoyé\u003c/span>\u003c/div>\n    \u003c/header>\n    \u003cbutton class=\"acct\" id=\"acct-btn\" type=\"button\">\u003cspan class=\"av\" id=\"acct-av\" aria-hidden=\"true\">?\u003c/span>\u003cspan class=\"nm\" id=\"acct-nm\">Se connecter\u003c/span>\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"card src\">\n    \u003cinput class=\"sr\" id=\"file\" type=\"file\" accept=\"audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac\">\n    \u003clabel class=\"drop\" id=\"drop\" for=\"file\">\n      \u003cspan class=\"dz-ic\">\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M7.5 18.5a4.5 4.5 0 0 1-.7-8.95A6 6 0 0 1 18.3 10 4.2 4.2 0 0 1 17.5 18.5z\"/>\u003cpath d=\"M12 17v-6\"/>\u003cpath d=\"m9.2 13.6 2.8-2.8 2.8 2.8\"/>\u003c/svg>\u003c/span>\n      \u003cstrong>Choisir un fichier audio\u003c/strong>\n      \u003cspan>ou le déposer ici · MP3, WAV, M4A, OGG, FLAC\u003c/span>\n    \u003c/label>\n    \u003cdiv class=\"srcrow\">\n      \u003cdiv class=\"fileinfo\">\u003cb id=\"fname\">Son de démonstration\u003c/b>\u003cspan id=\"fdur\">\u003c/span>\u003c/div>\n      \u003cbutton class=\"btn plain\" id=\"demo\" type=\"button\">Revenir au son de démonstration\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"grid\">\n    \u003csection class=\"stage\" aria-label=\"Aperçu\">\n      \u003cdiv class=\"card\">\n        \u003ccanvas id=\"orbit\" role=\"img\" aria-label=\"Vue de dessus : la source sonore tourne autour de la tête\">\u003c/canvas>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"transport\">\n          \u003cbutton class=\"play\" id=\"play\" type=\"button\" aria-label=\"Lecture\" disabled>\u003c/button>\n          \u003cdiv class=\"seekwrap\">\n            \u003cinput id=\"seek\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" step=\"1\" aria-label=\"Position dans le morceau\" disabled>\n            \u003cspan class=\"time\" id=\"time\">0:00 / 0:00\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"hint\" style=\"margin-top:10px\">Écoute au casque : la rotation ne se perçoit pas sur des haut-parleurs.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-label=\"Réglages\">\n      \u003cdiv class=\"card\">\n        \u003ch2>Effets rapides\u003c/h2>\n        \u003cp class=\"hint\">Un toucher règle tout, tu peux ensuite affiner.\u003c/p>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-preset=\"8d\">8D\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-preset=\"16d\">16D\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-preset=\"slowed\">Slowed + reverb\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-preset=\"speedup\">Speed up\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-preset=\"nightcore\">Nightcore\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-preset=\"bass\">Bass boost\u003c/button>\n          \u003cbutton class=\"chip lk\" type=\"button\" data-preset=\"concert\" data-lock=\"1\">Concert 8D\u003c/button>\n          \u003cbutton class=\"chip lk\" type=\"button\" data-preset=\"dream\" data-lock=\"1\">Dreamy\u003c/button>\n          \u003cbutton class=\"chip lk\" type=\"button\" data-preset=\"club\" data-lock=\"1\">Club bass\u003c/button>\n          \u003cbutton class=\"chip lk\" type=\"button\" data-preset=\"orbit\" data-lock=\"1\">Orbite lente\u003c/button>\n        \u003c/div>\n        \u003cp class=\"status\" id=\"chip-msg\" role=\"status\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003ch2>Réglages\u003c/h2>\n        \u003cdiv class=\"ctl first\">\n          \u003cdiv class=\"row\">\u003cspan class=\"lab\" id=\"modelab\">Rotation\u003c/span>\u003c/div>\n          \u003cdiv class=\"seg c3\" role=\"group\" aria-labelledby=\"modelab\">\n            \u003cbutton type=\"button\" id=\"mode-0\" aria-pressed=\"false\">Aucune\u003c/button>\n            \u003cbutton type=\"button\" id=\"mode-1\" aria-pressed=\"true\">8D\u003c/button>\n            \u003cbutton type=\"button\" id=\"mode-2\" aria-pressed=\"false\">16D\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"row\">\u003clabel for=\"period\">Vitesse de rotation\u003c/label>\u003coutput id=\"o-period\" for=\"period\">8 s / tour\u003c/output>\u003c/div>\n          \u003cinput id=\"period\" type=\"range\" min=\"3\" max=\"30\" step=\"1\" value=\"8\">\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"row\">\u003cspan class=\"lab\" id=\"dirlab\">Sens de rotation\u003c/span>\u003c/div>\n          \u003cdiv class=\"seg c2\" role=\"group\" aria-labelledby=\"dirlab\">\n            \u003cbutton type=\"button\" id=\"dir-cw\" aria-pressed=\"true\">Horaire\u003c/button>\n            \u003cbutton type=\"button\" id=\"dir-ccw\" aria-pressed=\"false\">Antihoraire\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"row\">\u003clabel for=\"radius\">Distance\u003c/label>\u003coutput id=\"o-radius\" for=\"radius\">3 m\u003c/output>\u003c/div>\n          \u003cinput id=\"radius\" type=\"range\" min=\"1\" max=\"8\" step=\"0.5\" value=\"3\">\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"row\">\u003clabel for=\"elev\">Mouvement vertical\u003c/label>\u003coutput id=\"o-elev\" for=\"elev\">25 %\u003c/output>\u003c/div>\n          \u003cinput id=\"elev\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"25\">\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"row\">\u003clabel for=\"rate\">Vitesse de lecture\u003c/label>\u003coutput id=\"o-rate\" for=\"rate\">100 %\u003c/output>\u003c/div>\n          \u003cinput id=\"rate\" type=\"range\" min=\"50\" max=\"150\" step=\"5\" value=\"100\">\n          \u003cp class=\"hint\">Sous 100 % le morceau ralentit et devient plus grave, au-dessus il accélère et devient plus aigu.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"row\">\u003clabel for=\"bass\">Renfort des basses\u003c/label>\u003coutput id=\"o-bass\" for=\"bass\">0 dB\u003c/output>\u003c/div>\n          \u003cinput id=\"bass\" type=\"range\" min=\"0\" max=\"15\" step=\"1\" value=\"0\">\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"row\">\u003clabel for=\"reverb\">Réverbération\u003c/label>\u003coutput id=\"o-reverb\" for=\"reverb\">30 %\u003c/output>\u003c/div>\n          \u003cinput id=\"reverb\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"30\">\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\" id=\"saved-card\">\n        \u003ch2>Mes réglages\u003c/h2>\n        \u003cdiv id=\"saved-out\" class=\"hint\">Connecte-toi pour garder tes réglages préférés.\u003c/div>\n        \u003cdiv class=\"saved\" id=\"saved-in\" hidden>\n          \u003cdiv class=\"saverow\">\n            \u003cinput class=\"in\" id=\"preset-name\" type=\"text\" maxlength=\"40\" placeholder=\"Nom du réglage\" aria-label=\"Nom du réglage\">\n            \u003cbutton class=\"btn main\" id=\"preset-save\" type=\"button\">Enregistrer\u003c/button>\n          \u003c/div>\n          \u003cp class=\"status\" id=\"preset-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n          \u003cul id=\"preset-list\">\u003c/ul>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\" id=\"plan-card\">\n        \u003ch2>Avec un compte, c’est mieux\u003c/h2>\n        \u003cp class=\"hint\">Gratuit, sans carte bancaire.\u003c/p>\n        \u003ctable class=\"plan\" id=\"plan\">\u003c/table>\n        \u003cdiv class=\"actions\">\u003cbutton class=\"btn main\" id=\"plan-btn\" type=\"button\" style=\"align-items:center;text-align:center;border-radius:999px\">Créer un compte gratuit\u003c/button>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\" id=\"exp-card\" hidden>\n        \u003ch2>Mes derniers exports\u003c/h2>\n        \u003cp class=\"hint\" id=\"exp-empty\">Rien pour le moment. Tes exports apparaîtront ici.\u003c/p>\n        \u003cul class=\"exps\" id=\"exp-list\">\u003c/ul>\n        \u003cbutton class=\"link\" id=\"exp-clear\" type=\"button\" hidden>Vider l’historique\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003ch2>Exporter\u003c/h2>\n        \u003cp class=\"hint\">Le fichier exporté est normalisé et contient les effets pour toujours.\u003c/p>\n        \u003cdiv class=\"ctl first\">\n          \u003cdiv class=\"row\">\u003cspan class=\"lab\" id=\"fadelab\">Fondu au début et à la fin\u003c/span>\u003c/div>\n          \u003cdiv class=\"seg c2\" role=\"group\" aria-labelledby=\"fadelab\">\n            \u003cbutton type=\"button\" id=\"fade-0\" aria-pressed=\"true\">Sans fondu\u003c/button>\n            \u003cbutton type=\"button\" id=\"fade-1\" class=\"lk\" aria-pressed=\"false\">Fondu de 2 s\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"limits\" id=\"ex-limits\">\u003c/p>\n        \u003cdiv class=\"actions\">\n          \u003cbutton class=\"dl block main\" id=\"ex-mp3\" type=\"button\" data-s=\"idle\" disabled>\u003cspan class=\"dl-pill\">\u003cspan class=\"dl-ic\">\u003csvg class=\"ic a\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 4v11\"/>\u003cpath d=\"m7 10.5 5 5 5-5\"/>\u003cpath d=\"M5 20h14\"/>\u003c/svg>\u003csvg class=\"ic c\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/>\u003c/svg>\u003c/span>\u003cspan class=\"dl-tx\">Exporter en MP3\u003csmall>192 kbit/s, lisible partout\u003c/small>\u003c/span>\u003csvg class=\"dl-ring\" viewBox=\"0 0 52 52\" aria-hidden=\"true\">\u003ccircle class=\"t\" cx=\"26\" cy=\"26\" r=\"23\"/>\u003ccircle class=\"b\" cx=\"26\" cy=\"26\" r=\"23\" pathLength=\"100\"/>\u003c/svg>\u003ci class=\"dl-stop\">\u003c/i>\u003ci class=\"dl-dot\">\u003c/i>\u003c/span>\u003c/button>\n          \u003cbutton class=\"dl block\" id=\"ex-wav\" type=\"button\" data-s=\"idle\" disabled>\u003cspan class=\"dl-pill\">\u003cspan class=\"dl-ic\">\u003csvg class=\"ic a\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 4v11\"/>\u003cpath d=\"m7 10.5 5 5 5-5\"/>\u003cpath d=\"M5 20h14\"/>\u003c/svg>\u003csvg class=\"ic c\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/>\u003c/svg>\u003c/span>\u003cspan class=\"dl-tx\">Exporter en WAV sans perte\u003csmall>Qualité maximale, fichier plus lourd\u003c/small>\u003c/span>\u003csvg class=\"dl-ring\" viewBox=\"0 0 52 52\" aria-hidden=\"true\">\u003ccircle class=\"t\" cx=\"26\" cy=\"26\" r=\"23\"/>\u003ccircle class=\"b\" cx=\"26\" cy=\"26\" r=\"23\" pathLength=\"100\"/>\u003c/svg>\u003ci class=\"dl-stop\">\u003c/i>\u003ci class=\"dl-dot\">\u003c/i>\u003c/span>\u003c/button>\n        \u003c/div>\n        \u003cp class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003csection class=\"sec\" aria-labelledby=\"how-h\">\n    \u003ch2 class=\"big\" id=\"how-h\">Comment ça marche\u003c/h2>\n    \u003col class=\"how-list\">\n      \u003cli>\u003cspan class=\"n\">1\u003c/span>\u003ch3>Ajoute ton morceau\u003c/h3>\u003cp>Dépose un MP3, WAV, M4A, OGG ou FLAC. Un son de démonstration est prêt si tu veux juste essayer.\u003c/p>\u003c/li>\n      \u003cli>\u003cspan class=\"n\">2\u003c/span>\u003ch3>Choisis un effet\u003c/h3>\u003cp>8D, 16D, slowed + reverb, speed up, nightcore ou bass boost. Un toucher règle tout, puis tu affines.\u003c/p>\u003c/li>\n      \u003cli>\u003cspan class=\"n\">3\u003c/span>\u003ch3>Exporte\u003c/h3>\u003cp>Touche « Exporter en MP3 » ou en WAV : le fichier contient les effets pour toujours.\u003c/p>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection class=\"sec\" aria-labelledby=\"faq-h\">\n    \u003ch2 class=\"big\" id=\"faq-h\">Questions fréquentes\u003c/h2>\n    \u003cdiv class=\"faq\">\n      \u003cdetails>\u003csummary>C’est quoi l’audio 8D ?\u003c/summary>\u003cp>Le son tourne autour de ta tête grâce à une rotation binaurale. Ce n’est pas un vrai son 8 canaux : l’effet est simulé pour un écouteur ou un casque stéréo.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>Pourquoi écouter au casque ?\u003c/summary>\u003cp>La rotation ne se perçoit pas sur des haut-parleurs : il faut que chaque oreille reçoive son propre signal.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>MP3 ou WAV ?\u003c/summary>\u003cp>Le MP3 est léger et lisible partout : 192 kbit/s sans compte, jusqu’à 320 kbit/s avec un compte. Le WAV est sans perte, avec la qualité maximale, mais le fichier est plus lourd ; il demande un compte gratuit.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>Mon morceau est-il envoyé quelque part ?\u003c/summary>\u003cp>Non. Le rendu et l’encodage se font dans ton navigateur, sur ton appareil.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>À quoi sert le compte gratuit ?\u003c/summary>\u003cp>Sans compte, tu exportes en MP3 192 kbit/s (5 morceaux par jour, 5 min maximum chacun). Avec un compte : MP3 320 kbit/s, export WAV sans perte, morceaux jusqu’à 15 min, exports illimités, effets exclusifs (Concert 8D, Dreamy, Club bass, Orbite lente), fondu au début et à la fin, tes réglages enregistrés et l’historique de tes exports sur tous tes appareils.\u003c/p>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cfooter class=\"foot\">\u003cspan>Rendu local dans ton navigateur\u003c/span>\u003cspan>Export MP3 ou WAV\u003c/span>\u003cspan>Aucun fichier envoyé\u003c/span>\u003cspan>\u003cbutton class=\"link\" type=\"button\" data-priv style=\"font-size:inherit;padding:0;min-height:0;display:inline\">Confidentialité\u003c/button>\u003c/span>\u003c/footer>\n\u003c/div>\n\n\u003cdialog id=\"dlg\" aria-labelledby=\"dlg-title\">\n  \u003cdiv class=\"dlgtop\">\u003ch2 id=\"dlg-title\">Compte\u003c/h2>\u003cbutton class=\"x\" id=\"dlg-x\" type=\"button\" aria-label=\"Fermer\">×\u003c/button>\u003c/div>\n\n  \u003cdiv class=\"stack\" id=\"dlg-config\" hidden>\n    \u003cp class=\"hint\">Les comptes utilisent ton projet Firebase. Colle ici sa configuration web (l’objet JSON de « Paramètres du projet », « Vos applications »). Elle reste dans ce navigateur.\u003c/p>\n    \u003cdiv class=\"field\">\u003clabel for=\"cfg-text\">Configuration Firebase\u003c/label>\n      \u003ctextarea class=\"in\" id=\"cfg-text\" spellcheck=\"false\" placeholder='{\"apiKey\":\"…\",\"authDomain\":\"…\",\"projectId\":\"…\",\"appId\":\"…\"}'>\u003c/textarea>\u003c/div>\n    \u003cp class=\"err\" id=\"cfg-err\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003cbutton class=\"btn main\" id=\"cfg-save\" type=\"button\">Activer les comptes\u003c/button>\n    \u003cdetails>\n      \u003csummary>Que faut-il activer dans Firebase ?\u003c/summary>\n      \u003col class=\"steps\">\n        \u003cli>Crée un projet sur la console Firebase et ajoute une application web.\u003c/li>\n        \u003cli>Dans Authentication, active les méthodes « Adresse e-mail / mot de passe » et « Google ».\u003c/li>\n        \u003cli>Dans Authentication, Paramètres, Domaines autorisés, ajoute le domaine où ce fichier est hébergé.\u003c/li>\n        \u003cli>Crée une base Firestore et colle ces règles :\u003c/li>\n      \u003c/ol>\n      \u003cpre class=\"code\">rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    match /users/{uid}/{document=**} {\n      allow read, write: if request.auth != null\n                         && request.auth.uid == uid;\n    }\n  }\n}\u003c/pre>\n    \u003c/details>\n  \u003c/div>\n\n  \u003cdiv class=\"stack\" id=\"dlg-auth\" hidden>\n    \u003cdiv class=\"lamp\" aria-hidden=\"true\">\n      \u003csvg class=\"svg\" viewBox=\"0 0 120 84\">\u003cpath d=\"M60 0v26\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/>\u003cpath d=\"M33 59C36 36 48 27 60 27s24 9 27 32z\" fill=\"currentColor\"/>\u003ccircle class=\"bulb\" cx=\"60\" cy=\"62\" r=\"7\"/>\u003cpath d=\"M30 59h60\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003c/svg>\n      \u003ci class=\"cone\">\u003c/i>\n      \u003ci class=\"ff\" style=\"--x:30%;--y:46px;--d:5.2s;--dl:.2s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:68%;--y:58px;--d:6.4s;--dl:1.1s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:22%;--y:84px;--d:7s;--dl:2s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:78%;--y:90px;--d:5.8s;--dl:.6s\">\u003c/i>\u003ci class=\"ff\" style=\"--x:48%;--y:100px;--d:6.8s;--dl:1.6s\">\u003c/i>\n    \u003c/div>\n    \u003ch3 class=\"auth-h\" id=\"auth-h\">Content de te revoir\u003c/h3>\n    \u003cp class=\"auth-s\" id=\"auth-s\">Connecte-toi pour garder tes réglages préférés.\u003c/p>\n    \u003cdiv class=\"seg\" style=\"--n:2\" role=\"group\" aria-label=\"Type de formulaire\">\n      \u003cbutton type=\"button\" id=\"tab-in\" aria-pressed=\"true\">Connexion\u003c/button>\n      \u003cbutton type=\"button\" id=\"tab-up\" aria-pressed=\"false\">Créer un compte\u003c/button>\n    \u003c/div>\n    \u003clabel class=\"cons\" for=\"a-consent\">\u003cinput type=\"checkbox\" id=\"a-consent\">\u003cspan>J’ai 15 ans ou plus (ou l’accord d’un parent) et j’ai lu la \u003cbutton class=\"link\" type=\"button\" data-priv>politique de confidentialité\u003c/button>. Mon compte est géré par Google Firebase.\u003ci>Obligatoire pour créer un compte ou continuer avec Google.\u003c/i>\u003c/span>\u003c/label>\n    \u003cbutton class=\"gbtn\" id=\"g-btn\" type=\"button\">\u003csvg viewBox=\"0 0 48 48\" width=\"20\" height=\"20\" aria-hidden=\"true\">\u003cpath fill=\"#EA4335\" d=\"M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z\"/>\u003cpath fill=\"#4285F4\" d=\"M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z\"/>\u003cpath fill=\"#FBBC05\" d=\"M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z\"/>\u003cpath fill=\"#34A853\" d=\"M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z\"/>\u003c/svg>\u003cspan>Continuer avec Google\u003c/span>\u003c/button>\n    \u003cdiv class=\"or\">ou avec ton e-mail\u003c/div>\n    \u003cform class=\"stack\" id=\"auth-form\" novalidate>\n      \u003cdiv class=\"fl\">\u003cinput class=\"in\" id=\"a-mail\" type=\"email\" autocomplete=\"email\" inputmode=\"email\" placeholder=\" \" required>\u003clabel for=\"a-mail\">Adresse e-mail\u003c/label>\u003c/div>\n      \u003cdiv class=\"fl\">\u003cinput class=\"in\" id=\"a-pass\" type=\"password\" autocomplete=\"current-password\" minlength=\"6\" placeholder=\" \" required>\u003clabel for=\"a-pass\">Mot de passe\u003c/label>\n        \u003cbutton class=\"eye\" id=\"a-eye\" type=\"button\" aria-label=\"Afficher le mot de passe\" aria-pressed=\"false\">\u003csvg class=\"ic on\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003c/svg>\u003csvg class=\"ic off\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 3l18 18\"/>\u003cpath d=\"M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.4 6.5A16.6 16.6 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.9\"/>\u003cpath d=\"M9.9 9.9a3 3 0 0 0 4.2 4.2\"/>\u003c/svg>\u003c/button>\u003c/div>\n      \u003cp class=\"err\" id=\"auth-err\" role=\"status\" aria-live=\"polite\">\u003c/p>\n      \u003cbutton class=\"btn main\" id=\"auth-go\" type=\"submit\">Se connecter\u003c/button>\n    \u003c/form>\n    \u003cbutton class=\"link\" id=\"forgot\" type=\"button\">Mot de passe oublié ?\u003c/button>\n    \u003cp class=\"legal\">Gratuit, sans carte bancaire. Tes fichiers ne quittent jamais ton appareil. \u003cbutton class=\"link\" type=\"button\" data-priv style=\"font-size:inherit;padding:0;min-height:0;display:inline\">Confidentialité\u003c/button>\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"stack\" id=\"dlg-user\" hidden>\n    \u003cdiv class=\"who\">\u003cspan class=\"big-av\" id=\"u-av\" aria-hidden=\"true\">?\u003c/span>\u003cp style=\"margin:0\">Connecté avec \u003cb id=\"u-mail\">\u003c/b>\u003c/p>\u003c/div>\n    \u003cul class=\"perks\">\n      \u003cli>MP3 320 kbit/s et export WAV sans perte\u003c/li>\n      \u003cli>Morceaux jusqu’à 15 min, exports illimités\u003c/li>\n      \u003cli>Effets exclusifs et fondu début / fin\u003c/li>\n      \u003cli>Réglages enregistrés et historique des exports\u003c/li>\n    \u003c/ul>\n    \u003cbutton class=\"btn plain\" id=\"logout\" type=\"button\">Se déconnecter\u003c/button>\n    \u003cp class=\"hint\" id=\"u-msg\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003cbutton class=\"btn plain\" id=\"u-export\" type=\"button\">Télécharger mes données\u003c/button>\n    \u003cbutton class=\"btn plain\" id=\"u-del\" type=\"button\" style=\"color:var(--err,#c0392b)\">Supprimer mon compte\u003c/button>\n    \u003cbutton class=\"link\" type=\"button\" data-priv>Confidentialité et mes droits\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\u003cscript>\n(function(){\n'use strict';\nvar $ = function(id){ return document.getElementById(id); };\nvar RATE = 20;\nvar P = { mode:1, period:8, dir:1, radius:3, elev:0.25, rate:1, bass:0, reverb:0.3 };\nvar ac = null, analyser = null, buf = null, fileName = 'demo';\nvar cur = null, playing = false, startCtx = 0, startOff = 0, startRate = 1, offset = 0;\nvar busy = false, irCache = null;\n/* Limites : modifie les nombres ici */\nvar LIMA = { guest: { sec: 300, kbps: 192, daily: 5 }, user: { sec: 900, kbps: 320, daily: Infinity } };\nvar user = null, fadeOn = false;\nfunction LA(){ return user ? LIMA.user : LIMA.guest; }\nfunction dayKey(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }\nfunction usedToday(){ try{ var d = JSON.parse(localStorage.getItem('cv-daily-audio') || 'null'); if(d && d.d === dayKey()) return d.n | 0; }catch(e){} return 0; }\nfunction bumpToday(){ try{ localStorage.setItem('cv-daily-audio', JSON.stringify({ d: dayKey(), n: usedToday() + 1 })); }catch(e){} }\nfunction openAcct(){ var b = document.getElementById('acct-btn'); if(b) b.click(); }\n\n/* ---------- Audio engine ---------- */\nfunction ensureCtx(){\n  if(!ac){\n    var AC = window.AudioContext || window.webkitAudioContext;\n    ac = new AC();\n    analyser = ac.createAnalyser();\n    analyser.fftSize = 1024;\n    analyser.connect(ac.destination);\n  }\n  if(ac.state === 'suspended'){ ac.resume(); }\n  return ac;\n}\n\nfunction getIR(c){\n  var sr = c.sampleRate;\n  if(irCache && irCache.sr === sr) return irCache.buf;\n  var len = Math.floor(sr * 2.4), ir = c.createBuffer(2, len, sr);\n  for(var ch = 0; ch \u003c 2; ch++){\n    var d = ir.getChannelData(ch), lp = 0;\n    for(var i = 0; i \u003c len; i++){\n      lp = lp * 0.55 + (Math.random() * 2 - 1) * 0.45;\n      d[i] = lp * Math.pow(1 - i / len, 3.2);\n    }\n  }\n  irCache = { sr: sr, buf: ir };\n  return ir;\n}\n\n/* Orbits used by the current settings: one for 8D, two counter-rotating for 16D. */\nfunction paths(p){\n  if(p.mode === 0) return [];\n  var a = [{ dir: p.dir, period: p.period, radius: p.radius, phase: 0, gain: p.mode === 2 ? 0.75 : 1, ey: 1 }];\n  if(p.mode === 2){\n    a.push({ dir: -p.dir, period: p.period * 0.7, radius: Math.min(8, p.radius * 1.3), phase: Math.PI, gain: 0.75, ey: -1 });\n  }\n  return a;\n}\nfunction angleOf(pt, t){ return pt.dir * 2 * Math.PI * t / pt.period + pt.phase; }\n\n/* One orbiting source, driven by position curves computed from output time. */\nfunction addPath(c, head, out, pt, elev, offOut, durOut, N, when){\n  var pn = c.createPanner(), node, i, a, t;\n  var g = c.createGain();\n  g.gain.value = pt.gain;\n  if(pn.positionX !== undefined){\n    pn.panningModel = 'HRTF';\n    pn.distanceModel = 'inverse';\n    pn.refDistance = 1;\n    pn.rolloffFactor = 0.35;\n    pn.maxDistance = 100;\n    pn.channelCount = 1;\n    pn.channelCountMode = 'explicit';\n    var xs = new Float32Array(N), ys = new Float32Array(N), zs = new Float32Array(N);\n    for(i = 0; i \u003c N; i++){\n      t = offOut + i * durOut / (N - 1);\n      a = angleOf(pt, t);\n      xs[i] = pt.radius * Math.sin(a);\n      zs[i] = -pt.radius * Math.cos(a);\n      ys[i] = pt.ey * elev * pt.radius * 0.5 * Math.sin(a * 0.5);\n    }\n    pn.positionX.value = xs[0]; pn.positionY.value = ys[0]; pn.positionZ.value = zs[0];\n    pn.positionX.setValueCurveAtTime(xs, when, durOut);\n    pn.positionY.setValueCurveAtTime(ys, when, durOut);\n    pn.positionZ.setValueCurveAtTime(zs, when, durOut);\n    node = pn;\n  } else {\n    var sp = c.createStereoPanner();\n    var pans = new Float32Array(N);\n    for(i = 0; i \u003c N; i++){\n      t = offOut + i * durOut / (N - 1);\n      pans[i] = Math.sin(angleOf(pt, t));\n    }\n    sp.pan.value = pans[0];\n    sp.pan.setValueCurveAtTime(pans, when, durOut);\n    node = sp;\n  }\n  head.connect(node); node.connect(g); g.connect(out);\n}\n\n/* Builds the full chain for any context (live or offline):\n   source (playback rate) -> bass shelf -> orbits or straight -> reverb mix -> master. */\nfunction buildGraph(c, b, p, offSrc, when){\n  var rate = p.rate;\n  var src = c.createBufferSource();\n  src.buffer = b;\n  src.playbackRate.value = rate;\n  var durOut = Math.max(0.05, (b.duration - offSrc) / rate), offOut = offSrc / rate;\n  var N = Math.max(2, Math.ceil(durOut * RATE) + 1);\n  var master = c.createGain();\n  var head = src;\n  if(p.bass > 0){\n    var lo = c.createBiquadFilter();\n    lo.type = 'lowshelf'; lo.frequency.value = 130; lo.gain.value = p.bass;\n    src.connect(lo); head = lo;\n  }\n  var dry = c.createGain();\n  dry.connect(master);\n  var list = paths(p);\n  if(list.length === 0){ head.connect(dry); }\n  else { list.forEach(function(pt){ addPath(c, head, dry, pt, p.elev, offOut, durOut, N, when); }); }\n  var wet = c.createGain();\n  wet.gain.value = p.reverb * 0.8;\n  var conv = c.createConvolver();\n  conv.buffer = getIR(c);\n  head.connect(conv); conv.connect(wet); wet.connect(master);\n  return { src: src, master: master, level: Math.pow(10, -p.bass / 40) };\n}\n\nfunction killGraph(){\n  if(!cur) return;\n  var g = cur; cur = null;\n  var t = ac.currentTime;\n  g.src.onended = null;\n  try{\n    g.master.gain.cancelScheduledValues(t);\n    g.master.gain.setValueAtTime(g.master.gain.value, t);\n    g.master.gain.linearRampToValueAtTime(0, t + 0.025);\n    g.src.stop(t + 0.04);\n  }catch(e){}\n  setTimeout(function(){ try{ g.master.disconnect(); }catch(e){} }, 150);\n}\n\n/* Position in the source file, in seconds. */\nfunction tNow(){\n  if(playing && cur && buf){\n    return Math.min(buf.duration, startOff + Math.max(0, ac.currentTime - startCtx) * startRate);\n  }\n  return offset;\n}\n\nfunction startAt(off){\n  if(!buf) return;\n  var c = ensureCtx();\n  killGraph();\n  var when = c.currentTime + 0.04;\n  var g = buildGraph(c, buf, P, off, when);\n  g.master.gain.setValueAtTime(0, when);\n  g.master.gain.linearRampToValueAtTime(g.level, when + 0.03);\n  g.master.connect(analyser);\n  g.src.start(when, off);\n  g.src.onended = function(){\n    if(cur === g){ cur = null; playing = false; offset = 0; setPlayU <body>
<template id="ui">
<style>
:root{--bg:#E6ECEF;--surface:#F6F9FA;--ink:#0F1E2B;--muted:#53677A;--line:#C3CFD7;--accent:#00767F;--accent-ink:#FFFFFF;--soft:#D7ECEE;--glow:rgba(0,118,127,.20);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B161E;--surface:#12212C;--ink:#E3EEF3;--muted:#8DA3B3;--line:#243847;--accent:#3CD2C8;--accent-ink:#04201E;--soft:#143039;--glow:rgba(60,210,200,.26);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B161E;--surface:#12212C;--ink:#E3EEF3;--muted:#8DA3B3;--line:#243847;--accent:#3CD2C8;--accent-ink:#04201E;--soft:#143039;--glow:rgba(60,210,200,.26);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* Menu latéral */
.side{position:relative;z-index:30;flex:none;width:272px;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-right:1px solid var(--line);overflow:hidden;transition:width .32s cubic-bezier(.4,0,.2,1),padding .32s}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding-inline:4px}
.s-brand{display:flex;align-items:center;gap:11px;min-width:0;font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.logo{flex:none;width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;box-shadow:0 8px 18px -10px var(--accent)}
.s-tog{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;font-size:22px;cursor:pointer;color:var(--ink)}
.s-tog:hover{background:var(--soft)}
.s-tog .open{display:none}
.s-search{display:flex;align-items:center;gap:12px;min-height:48px;margin-top:8px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--muted);cursor:text;transition:border-color .15s,box-shadow .15s}
.s-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow);color:var(--accent)}
.s-search .ic{font-size:19px}
.s-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;outline:0}
.s-search input::placeholder{color:var(--muted)}
.s-search input:focus-visible{outline:0}
.s-search kbd{font-family:inherit;font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.s-res{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--bg);max-height:42vh;overflow:auto}
.s-res button{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;padding:6px 10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer}
.s-res button:hover,.s-res button.on{background:var(--soft);color:var(--accent)}
.s-res small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.s-res p{margin:6px 10px;color:var(--muted);font-size:13px}
.s-nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.s-item{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:14px;background:transparent;color:var(--ink);font-weight:500;text-align:left;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.s-item .ic{font-size:21px}
.s-item:hover{background:var(--soft)}
.s-item[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 10px 22px -14px var(--accent)}
.s-item .av{flex:none;width:30px;height:30px;margin-left:-5px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:14px}
.s-item .tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.s-item .tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.s-item .tx small{font-weight:400;color:var(--muted);font-size:12px}
.s-div{height:1px;margin:8px 8px;background:var(--line);flex:none}
.s-lab{margin:2px 14px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.s-tools{display:flex;flex-direction:column;gap:1px;flex:1 1 0;min-height:0;overflow:auto;scrollbar-width:thin}
.s-sub{margin:10px 14px 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.8}
.s-tools button{display:flex;align-items:center;gap:12px;min-height:38px;padding:0 14px 0 20px;border:0;border-radius:10px;background:transparent;color:var(--muted);text-align:left;cursor:pointer;white-space:nowrap;font-size:14px}
.s-tools button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .15s,transform .15s}
.s-tools button:hover{background:var(--soft);color:var(--ink)}
.s-tools button[aria-current="true"]{color:var(--accent);font-weight:600}
.s-tools button[aria-current="true"]::before{background:var(--accent);transform:scale(1.4)}
.s-grow{flex:0 0 0;min-height:0}
.s-promo{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,var(--soft),var(--surface));margin-bottom:4px}
.s-promo b{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-size:16px}
.s-promo span{color:var(--muted);font-size:12.5px;line-height:1.35}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:44px;margin-top:2px;padding:0 14px;border-radius:999px;border:1px solid #dadce0;background:#fff;color:#1f1f1f;font-weight:500;font-size:14px;cursor:pointer;transition:box-shadow .15s}
.gbtn svg{width:19px;height:19px;flex:none}
.gbtn:hover{box-shadow:0 2px 10px rgba(60,64,67,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gbtn{background:#131314;color:#e3e3e3;border-color:#8e918f}}
:root[data-theme="dark"] .gbtn{background:#131314;color:#e3e3e3;border-color:#8e918f}
@media (max-height:1000px) and (min-width:821px){.s-promo{padding:0;border:0;background:none;margin:0}.s-promo b,.s-promo span{display:none}}
.th-moon{display:none}
.is-dark .th-sun{display:none}
.is-dark .th-moon{display:block}

/* Zone principale */
main{flex:1;min-width:0;height:100dvh;display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;background:var(--bg);min-height:0}
.m-bar{display:none;flex:none;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.m-bar .s-brand{flex:1;font-size:18px}
.m-bar .logo{width:32px;height:32px;font-size:18px}
.m-bar .av{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.s-scrim{display:none}
.v-app{flex:1;min-height:0;overflow:auto;padding:32px 20px 48px;background:var(--bg)}
.v-in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.v-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px}
.v-in h1{margin:0;font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1.08;letter-spacing:-.02em}
.v-in .lede{margin:0;color:var(--muted);font-size:16px;max-width:60ch}
.v-note{margin:0;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface);font-size:14px}
.v-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:4px}
.v-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.v-card.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),0 14px 30px -22px var(--accent)}
.v-card .v-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:24px}
.v-card h2{margin:4px 0 0;font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-size:21px}
.v-card p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.v-card .v-badge{align-self:flex-start;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600}
.v-card small{color:var(--muted);font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;overflow-wrap:anywhere}
.v-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;margin-top:4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;cursor:pointer}
.v-btn .ic{font-size:19px}
.v-btn:hover{filter:brightness(1.08)}
.v-btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.v-in details{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px}
.v-in summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.v-in details p,.v-in details ul{margin:0 0 14px;color:var(--muted);font-size:14px}
.v-in details ul{padding-left:20px;display:grid;gap:4px}
.v-steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.v-steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:14px}
.v-steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.v-small{margin:0;color:var(--muted);font-size:13px}
.v-os{align-self:flex-start;display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.v-os button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:0 20px;min-height:40px;border-radius:999px;cursor:pointer}
.v-os button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.v-row{display:flex;flex-wrap:wrap;gap:10px}
.v-row .v-btn{display:inline-flex;padding:0 24px;margin:0;border:0;font:inherit;font-weight:600}
.v-btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.v-btn:disabled{opacity:.5;cursor:default}
.v-btn[hidden]{display:none}
.v-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0}
.v-kv>div{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.v-kv dt{color:var(--muted);font-size:12.5px}
.v-kv dd{margin:2px 0 0;font-weight:600;font-family:'IBM Plex Mono',ui-monospace,monospace}
.v-in .lede.bad{color:#c0392b}
.v-chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer}
.v-chk input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
#priv-body{display:flex;flex-direction:column;gap:8px}
#priv-body h2{margin:16px 0 0;font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-size:20px}
#priv-body p,#priv-body li{margin:0;font-size:14.5px;line-height:1.55}
#priv-body ul{margin:0;padding-left:20px;display:grid;gap:6px}
.s-item .dot{position:absolute;top:12px;left:30px;width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px var(--surface)}
.s-item .dot[hidden]{display:none}

/* Repliable sur ordinateur */
@media (min-width:821px){
  body.collapsed .side{width:80px;padding-inline:12px}
  body.collapsed .s-brand,body.collapsed .s-lab,body.collapsed .s-tools,body.collapsed .s-promo,body.collapsed .s-item>span:not(.av),body.collapsed .s-item .tx,body.collapsed .s-search input,body.collapsed .s-search kbd,body.collapsed .s-res{display:none}
  body.collapsed .s-head{justify-content:center}
  body.collapsed .s-tog .close{display:none}
  body.collapsed .s-tog .open{display:block}
  body.collapsed .s-search{justify-content:center;padding:0;cursor:pointer;width:48px;margin-inline:auto}
  body.collapsed .s-item{justify-content:center;padding:0}
  body.collapsed .s-item .av{margin-left:0}
}
/* Tiroir sur téléphone */
@media (max-width:820px){
  .s-search kbd{display:none}
  .m-bar{display:flex}

    if(appOS === 'win') detectArch(function(a){ if(a){ appArch = a; if(page === 'app') renderApp(); } });
  }
}
$('os-win').addEventListener('click', function(){ appOS = 'win'; if(!appArch) detectArch(function(a){ if(a){ appArch = a; if(page === 'app') renderApp(); } }); renderApp(); });

/* ---------- Mises à jour (application installée seulement) ---------- */
var UPD = { checking: false, installing: false, info: null, latest: '', url: '', available: false, err: '', done: false };
function tauriInvoke(cmd, args){
  var i = window.__TAURI_INTERNALS__;
  if(i && typeof i.invoke === 'function') return i.invoke(cmd, args || {});
  return Promise.reject(new Error('Fonction disponible seulement dans l’application installée.'));
}
function semver(v){ var m = /(\d+)\.(\d+)\.(\d+)/.exec(String(v || '')); return m ? [+m[1], +m[2], +m[3]] : null; }
function isNewer(a, b){ for(var i = 0; i < 3; i++){ if(a[i] !== b[i]) return a[i] > b[i]; } return false; }
function updAsset(info){
  if(info.os === 'macos') return APP.files.mac;
  return APP.files[info.arch === 'aarch64' ? 'arm64' : (info.arch === 'x86' ? 'x86' : 'x64')];
}
function errText(e){ return (e && e.message) ? e.message : String(e || 'erreur inconnue'); }
function checkUpdate(){
  if(UPD.checking || UPD.installing) return Promise.resolve();
  if(!appConfigured()){ UPD.err = 'Les mises à jour ne sont pas encore configurées.'; renderUpd(); return Promise.resolve(); }
  UPD.checking = true; UPD.err = ''; UPD.done = false; renderUpd();
  return tauriInvoke('app_info').then(function(info){
    UPD.info = info;
    return fetch('https://api.github.com/repos/' + APP.repo + '/releases/latest', { headers: { 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
  }).then(function(r){
    if(r.status === 404) throw new Error('NONE');
    if(!r.ok) throw new Error('HTTP');
    return r.json();
  }).then(function(rel){
    var cur = semver(UPD.info.version), lat = semver(rel.tag_name), want = updAsset(UPD.info);
    UPD.latest = String(rel.tag_name || ''); UPD.url = '';
    (rel.assets || []).forEach(function(a){ if(a.name === want) UPD.url = a.browser_download_url; });
    UPD.available = !!(cur && lat && isNewer(lat, cur));
    UPD.done = true;
    if(UPD.available && !UPD.url){ UPD.err = 'La version ' + UPD.latest + ' est publiée mais le fichier « ' + want + ' » n’est pas encore prêt. Réessaie dans quelques minutes.'; UPD.available = false; }
    lsSet('cv-upd-check', String(Date.now()));
  }).catch(function(e){
    var m = e && e.message;
    if(navigator.onLine === false) UPD.err = 'Pas de connexion internet : impossible de chercher une mise à jour.';
    else if(m === 'NONE') UPD.err = 'Aucune version n’est encore publiée sur GitHub.';
    else UPD.err = 'Impossible de lire les versions sur GitHub pour le moment. Vérifie ta connexion et réessaie.';
  }).then(function(){ UPD.checking = false; renderUpd(); });
}
function installUpdate(){
  if(!UPD.url || UPD.installing) return;
  UPD.installing = true; UPD.err = ''; renderUpd();
  tauriInvoke('install_update', { url: UPD.url }).catch(function(e){
    UPD.installing = false; UPD.err = 'La mise à jour a échoué : ' + errText(e); renderUpd();
  });
}
function renderUpd(){
  var mac = !!(UPD.info && UPD.info.os === 'macos');
  $('upd-cur').textContent = UPD.info ? 'v' + UPD.info.version : '…';
  $('upd-lat').textContent = UPD.latest || '—';
  var s;
  if(UPD.installing) s = 'Téléchargement de ' + UPD.latest + '… L’application va se fermer, s’installer, puis se rouvrir toute seule.';
  else if(UPD.checking) s = 'Recherche en cours…';
  else if(UPD.err) s = UPD.err;
  else if(UPD.available) s = 'Une nouvelle version est disponible : ' + UPD.latest + '.';
  else if(UPD.done) s = 'Tu as la dernière version. Rien à faire.';
  else s = 'Clique sur « Rechercher une mise à jour » pour voir si une nouvelle version est publiée.';
  var st = $('upd-status'); st.textContent = s; st.className = 'lede' + (UPD.err ? ' bad' : '');
  $('upd-go').hidden = !UPD.available || UPD.installing;
  $('upd-check').disabled = UPD.checking || UPD.installing;
  $('upd-go').disabled = UPD.installing;
  $('upd-how').textContent = mac
    ? 'L’application se ferme, la nouvelle version est copiée dans Applications, puis elle se rouvre. Si le Mac refuse la copie, le fichier .dmg s’ouvre : glisse alors l’application dans Applications.'
    : 'Windows va peut-être demander l’autorisation d’installer. L’application se ferme, s’installe, puis se rouvre toute seule.';
  $('upd-dot').hidden = !UPD.available;
}
$('upd-check').addEventListener('click', checkUpdate);
$('upd-go').addEventListener('click', installUpdate);
$('upd-auto').checked = lsGet('cv-autoupd') !== '0';
$('upd-auto').addEventListener('change', function(){ lsSet('cv-autoupd', this.checked ? '1' : '0'); });
if(IN_APP){
  $('t-upd').hidden = false;
  tauriInvoke('app_info').then(function(i){ UPD.info = i; renderUpd(); }).catch(function(){});
  var lastChk = +lsGet('cv-upd-check') || 0;
  if(lsGet('cv-autoupd') !== '0' && Date.now() - lastChk > 6 * 3600 * 1000) setTimeout(checkUpdate, 4000);
}

  P('Où : Google héberge ces données (Firebase Authentication et Cloud Firestore, Google Ireland Limited / Google LLC' + (LEGAL.region ? ', région ' + LEGAL.region : '') + '). Elles peuvent être traitées hors de l’Union européenne ; ces transferts sont encadrés par des clauses contractuelles types et le Data Privacy Framework. Ce service n’est contacté qu’après que tu as coché la case de confidentialité ou que tu te connectes.');

$('priv-back').addEventListener('click', function(){ show('fichiers'); });

function renderTools(){
  var box = $('s-tools'); box.textContent = '';
  var isF = page !== 'audio';
  var ORDER = ['pdf', 'doc', 'img', 'data', 'zip', 'audio'];
  var list = isF ? tools.map(function(t, i){ return { id: t.id, name: t.name, short: t.short, cat: t.cat, i: i }; }).sort(function(a, b){
    return (ORDER.indexOf(a.cat) - ORDER.indexOf(b.cat)) || (a.i - b.i);
  }) : AUDIO;
  $('s-lab').textContent = isF ? 'Outils fichiers' : 'Effets audio';
  var lastCat = '';
  list.forEach(function(t){
    if(t.cat && t.cat !== lastCat){
      lastCat = t.cat;
      var gl = document.createElement('div'); gl.className = 's-sub'; gl.textContent = CATLAB[t.cat] || t.cat; box.appendChild(gl);
    }
    var b = document.createElement('button'); b.type = 'button'; b.textContent = t.name; b.dataset.id = t.id;
    if(t.short) b.title = t.short;
    b.addEventListener('click', function(){ pick(isF ? 'fichiers' : 'audio', t.id); });
    box.appendChild(b);
  });
  markTool();
}
function markTool(){
  Array.prototype.forEach.call($('s-tools').children, function(b){
    if(!b.dataset.id) return;
    if(page === 'fichiers' && b.dataset.id === curTool) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
  });
}
function pick(p, id){
  show(p);
  send(p, p === 'fichiers' ? { type: 'selectTool', id: id } : { type: 'preset', value: id });
  if(mqMobile.matches) closeDrawer();
}

/* ---------- Recherche ---------- */
var q = $('s-q'), res = $('s-res'), hits = [], sel = 0;
function index(){
  var out = [];
  tools.forEach(function(t){ out.push({ p: 'fichiers', id: t.id, name: t.name, tag: 'Fichiers', hay: norm(t.name + ' ' + t.short + ' ' + t.id) }); });
  AUDIO.forEach(function(t){ out.push({ p: 'audio', id: t.id, name: t.name, tag: 'Audio', hay: norm(t.name + ' ' + t.kw) }); });
  return out;
}
function search(){
  var v = norm(q.value).trim();
  res.textContent = '';
  if(!v){ res.hidden = true; hits = []; return; }
  var words = v.split(/\s+/);
  hits = index().filter(function(x){ return words.every(function(w){ return x.hay.indexOf(w) > -1; }); }).slice(0, 8);
  sel = 0;
  res.hidden = false;
  if(!hits.length){ var p = document.createElement('p'); p.textContent = 'Aucun outil pour « ' + q.value.trim() + ' ».'; res.appendChild(p); return; }
  hits.forEach(function(h, i){
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'option');
    if(i === 0) b.className = 'on';
    var n = document.createElement('span'); n.textContent = h.name;
    var s = document.createElement('small'); s.textContent = h.tag;
    b.appendChild(n); b.appendChild(s);
    b.addEventListener('click', function(){ choose(h); });
    res.appendChild(b);
  });
}
function choose(h){ pick(h.p, h.id); q.value = ''; search(); q.blur(); }
q.addEventListener('input', search);
q.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && hits[sel]){ e.preventDefault(); choose(hits[sel]); }
  else if(e.key === 'Escape'){ q.value = ''; search(); q.blur(); }
  else if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(!hits.length) return;
    sel = (sel + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
    Array.prototype.forEach.call(res.children, function(c, i){ c.className = i === sel ? 'on' : ''; });
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) && !e.metaKey && !e.ctrlKey){
    e.preventDefault(); focusSearch();
  }
});
function focusSearch(){
  if(mqMobile.matches) openDrawer(); else setCollapsed(false);
  setTimeout(function(){ q.focus(); }, 60);
}
$('s-sbox').addEventListener('click', function(){
  if(body.classList.contains('collapsed') && !mqMobile.matches){ setCollapsed(false); setTimeout(function(){ q.focus(); }, 340); }
});

/* ---------- Replier / tiroir ---------- */
function setCollapsed(on){
  body.classList.toggle('collapsed', on);
  var t = $('s-tog');
  t.setAttribute('aria-expanded', on ? 'false' : 'true');
  t.setAttribute('aria-label', on ? 'Déplier le menu' : 'Réduire le menu');
  t.title = t.getAttribute('aria-label');
  lsSet('cv-collapsed', on ? '1' : '0');
}
function openDrawer(){ body.classList.add('open'); }
function closeDrawer(){ body.classList.remove('open'); }
$('s-tog').addEventListener('click', function(){

});

$('s-g').addEventListener('click', openAcct);

/* ---------- Thème ---------- */
var mqDark = window.matchMedia('(prefers-color-scheme:dark)');
function effective(){ var t = root.getAttribute('data-theme'); return t || (mqDark.matches ? 'dark' : 'light'); }
function paintTheme(){
  var d = effective() === 'dark';
  root.classList.toggle('is-dark', d);
  $('s-theme-t').textContent = d ? 'Thème clair' : 'Thème sombre';
}
function applyTheme(v){
  if(v === 'light' || v === 'dark') root.setAttribute('data-theme', v); else root.removeAttribute('data-theme');
  paintTheme();
}
applyTheme(lsGet('cv-theme'));
(mqDark.addEventListener ? mqDark.addEventListener('change', paintTheme) : mqDark.addListener(paintTheme));
$('s-theme').addEventListener('click', function(){
  var next = effective() === 'dark' ? 'light' : 'dark';
  lsSet('cv-theme', next); applyTheme(next);
  ['fichiers', 'audio'].forEach(function(p){ if(ready[p]) post(p, { type: 'theme', value: next }); });
});

/* ---------- Démarrage ---------- */
var H0 = location.hash.replace('#', '');
show(['audio', 'app', 'upd', 'priv'].indexOf(H0) > -1 ? H0 : 'fichiers');
})();
