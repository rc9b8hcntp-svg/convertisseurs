name: Construire les MSI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  msi:
    name: MSI ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   target: x86_64-pc-windows-msvc }
          - { arch: x86,   target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Installer les dépendances
        run: npm install

      - name: Construire le MSI
        run: npx tauri build --target ${{ matrix.target }} --bundles msi

      - name: Donner un nom fixe au MSI
        shell: pwsh
        run: |
          $f = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          Copy-Item $f.FullName "Convertisseurs-${{ matrix.arch }}.msi"

      - name: Garder le MSI
        uses: actions/upload-artifact@v4
        with:
          name: Convertisseurs-${{ matrix.arch }}-msi
          path: Convertisseurs-${{ matrix.arch }}.msi
          if-no-files-found: error

  release:
    name: Publier sur GitHub (pour les liens du site)
    needs: msi
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Convertisseurs-*-msi
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
